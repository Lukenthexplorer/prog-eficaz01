{% for nota in notas %}
<li class="note-card">
    <div class="note-actions">
        <a href="{{ url_for('edit_note', id=nota.id) }}" class="action-btn">
            <img src="{{ url_for('static', filename='img/pencil.svg') }}" alt="Editar" class="action-icon">
        </a>
        <form method="POST" action="{{ url_for('remove_note', id=nota.id) }}" class="delete-form">
            <button type="submit" class="action-btn">
                <img src="{{ url_for('static', filename='img/bin.svg') }}" alt="Excluir" class="action-icon">
            </button>
        </form>
    </div>
    <h1 class="note-title">{{ nota.titulo }}</h1>
    <p class="note-details">{{ nota.detalhes }}</p>
</li>
{% endfor %}
