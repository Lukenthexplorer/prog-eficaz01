{% extends 'base.html' %}

{% block content %}
<div class="edit-page">
  <h2 class="edit-heading">Editar nota</h2>

  <form class="form" method="POST" action="{{ url_for('edit_note', id=nota.id) }}">
    <label class="form-label">
      Título
      <input class="form-input" name="titulo" type="text" value="{{ nota.titulo }}">
    </label>
    <label class="form-label">
      Detalhes
      <input class="form-input" name="detalhes" type="text" value="{{ nota.detalhes }}">
    </label>

    <div class="edit-actions">
      <button class="form-button" type="submit" name="edit_button">Salvar</button>
      <a href="{{ url_for('home') }}" class="form-cancel" name="edit_cancel">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
